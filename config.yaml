router:
    # Paths to llama-server binary and output dir for llama-server logs
    bin: ./llama.cpp/build/bin/llama-server
    llama-log-dir: ./logs

    # Internal listen address for llama-server
    listen: 127.0.0.1:10000

    # Frequency of pings sent to the router on startup, and how long
    # to wait for router process to start/shut down
    poll-interval-ms: 50
    poll-timeout-ms: 10000
    shutdown-grace-period-ms: 10000
    
# External listen address. OAI interface is exposed here.
listen: 192.168.87.30:10001

# Seconds of no requests after which current models are unloaded
idle-timeout: 300

model-load:
    poll-interval-ms: 100
    poll-timeout-ms: 50000

models:
    qwen3.8-27b:
        model: /home/fox/kitsu/models/qwen3.8-dense-mtp/Qwen3.8-27B-UD-Q4_K_XL.gguf
        mmproj: /home/fox/kitsu/models/qwen3.8-dense-mtp/mmproj-BF16.gguf

        spec-type: draft-mtp
        spec-draft-n-max: 2

        fit-target: 512
        n-gpu-layers: 99

        ladder: [disable-spec, mmproj-to-cpu]
    qwen3.5-9b:
        model: /home/fox/kitsu/models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
        mmproj: /home/fox/kitsu/models/qwen3.5-9b/mmproj-BF16.gguf

        fit-target: 512
        n-gpu-layers: 99

        ladder: []

default-models: [qwen3.8-27b, qwen3.5-9b]